[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
archiver_core = { path = "../archiver_core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories-next = "2"
notify-rust = "4.18.0"

[features]
# Serve the embedded `frontend/` folder (required for plain `cargo build`).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "=3.13.0"
