[package]
name = "ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
archiver_core = { path = "../archiver_core" }
eframe = { version = "=0.24.1", default-features = false, features = ["glow", "persistence", "default_fonts"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories-next = "2"
native-dialog = "0.7"
notify-rust = "4.18.0"

[dev-dependencies]
tempfile = "=3.13.0"
