[package]
name = "archiver_core"
version = "0.1.0"
edition = "2021"

[dependencies]
mochi-core = { git = "https://github.com/immerh8/MOCHI", rev = "e404917f56b4593bef48b3ad08e62a1e29c33872" }
blake3 = { version = "1", default-features = false, features = ["std"] }
thiserror = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
aho-corasick = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "=0.10.3"

[dev-dependencies]
tempfile = "=3.13.0"
